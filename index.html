<style>
:root{--navy:#17325c;--blue:#2b5797;--green:#2f8a57;--orange:#E0862B;--bg:#f4f6fa;--line:#dde3ec;--text:#1f2633;--sub:#667085;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.demo{background:#fff6e8;border-bottom:1px solid #f0d9b5;font-size:13px;color:#8a5a14;padding:7px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.demo b{font-weight:700}
.demo .seg{display:inline-flex;border:1px solid #e6c48f;border-radius:999px;overflow:hidden}
.demo .seg button{border:0;background:#fff;padding:3px 12px;font-size:12.5px;color:#8a5a14}
.demo .seg button.on{background:var(--orange);color:#fff}
header{background:var(--navy);color:#fff}
.hwrap{max-width:1160px;margin:0 auto;padding:18px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:48px;height:48px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.brand h1{margin:0;font-size:20px;font-weight:900;letter-spacing:-.3px}
.brand p{margin:0;font-size:12.5px;opacity:.75}
.hright{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:500}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.who{font-size:13px;opacity:.9;margin-right:4px}
nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.nwrap{max-width:1160px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
nav a{display:block;padding:13px 16px;color:var(--sub);text-decoration:none;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
nav a.on{color:var(--navy);border-color:var(--green);font-weight:700}
nav a .lock{font-size:11px;background:#eef1f6;color:var(--sub);border-radius:6px;padding:1px 6px;margin-left:5px}
main{max-width:1160px;margin:0 auto;padding:22px 20px 60px}
.hero{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:18px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero h2{margin:0 0 4px;font-size:19px}
.hero p{margin:0;color:var(--sub);font-size:14px}
.stats{margin-left:auto;display:flex;gap:22px}
.stat b{display:block;font-size:22px;color:var(--navy);font-weight:900}
.stat span{font-size:12px;color:var(--sub)}
.layout{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}.stats{margin-left:0}}
aside{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;position:sticky;top:64px}
@media(max-width:860px){aside{position:static}}
aside h4{margin:14px 0 8px;font-size:13px;color:var(--sub);font-weight:700}
aside h4:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--text)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.area-group{margin-bottom:6px}
.area-group .chip.main{font-weight:700}
.area-group .subs{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0 4px 10px}
.area-group .subs .chip{font-size:12px;padding:2px 9px}
.reset{margin-top:14px;width:100%;font-size:13px}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#fff}
.toolbar select{border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff}
.count{font-size:13px;color:var(--sub);margin:-4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--blue);box-shadow:0 6px 18px rgba(23,50,92,.08);transform:translateY(-2px)}
.ctop{display:flex;gap:6px;align-items:center}
.type{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:#eef3fb;color:var(--blue)}
.memb{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:#fdf1e3;color:#b5651d}
.new{font-size:11.5px;font-weight:700;color:var(--green)}
.card h3{margin:0;font-size:16px;line-height:1.4}
.card p{margin:0;color:var(--sub);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;border-radius:6px;padding:1px 7px;background:#f1f3f7;color:#475467}
.tag.ai{background:#eaf6ef;color:var(--green);font-weight:700}
.cfoot{margin-top:auto;display:flex;gap:8px;justify-content:space-between;font-size:12.5px;color:var(--sub);border-top:1px dashed var(--line);padding-top:8px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:40px;text-align:center;color:var(--sub)}
.gate{background:#fff;border:1px solid var(--line);border-radius:16px;padding:44px 24px;text-align:center;max-width:560px;margin:30px auto}
.gate h2{margin:10px 0 6px}
.gate p{color:var(--sub);margin:0 0 18px}
.gicon{width:60px;height:60px;border-radius:50%;background:#fdf1e3;display:grid;place-items:center;margin:0 auto}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:middle}
th{color:var(--sub);font-weight:500;font-size:13px;background:#fafbfd}
.mini{padding:4px 10px;font-size:12.5px;border-radius:8px}
.mini.ok{background:var(--green);border-color:var(--green);color:#fff}
.status{font-size:12px;border-radius:6px;padding:2px 8px;font-weight:700}
.st-wait{background:#fdf1e3;color:#b5651d}.st-ok{background:#eaf6ef;color:var(--green)}.st-no{background:#f1f3f7;color:var(--sub)}
.sheetnote{font-size:12.5px;color:var(--sub);margin-top:10px}
.overlay{position:fixed;inset:0;background:rgba(15,25,45,.45);display:none;align-items:flex-start;justify-content:center;z-index:20;padding:40px 14px;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:18px;max-width:620px;width:100%;padding:22px 24px;position:relative}
.modal h2{margin:0 0 6px;font-size:20px}
.x{position:absolute;right:14px;top:12px;border:0;background:none;font-size:22px;color:var(--sub)}
.meta{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;font-size:14px;margin:14px 0}
.meta dt{color:var(--sub)}.meta dd{margin:0}
.file{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 0}
.file .ext{width:40px;height:40px;border-radius:9px;background:#eef3fb;color:var(--blue);display:grid;place-items:center;font-weight:900;font-size:12px}
.file div{flex:1;font-size:14px}.file small{display:block;color:var(--sub)}
.form label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
.form input[type=text],.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.form textarea{min-height:70px;resize:vertical}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.radio{display:flex;gap:8px}
.radio label{flex:1;margin:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:500;cursor:pointer}
.radio input{margin-right:6px}
.radio label small{display:block;color:var(--sub);font-weight:400;margin-left:20px}
.check{display:flex;gap:8px;align-items:flex-start;font-weight:400!important;font-size:13.5px!important;background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0!important}
.drop{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--sub);font-size:13.5px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.err{color:#c0392b;font-size:13px;margin-top:8px;min-height:18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:30;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;font-size:12.5px;color:var(--sub);padding:20px}
.cfoot span:last-child{white-space:nowrap}
.subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:14px;font-weight:500;color:var(--sub)}
.subtabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.subtabs .cnt{font-size:11px;background:var(--orange);color:#fff;border-radius:999px;padding:0 6px;margin-left:5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:84px;padding:5px 6px;font-size:12.5px}
.cal .dh{min-height:auto;background:#fafbfd;color:var(--sub);text-align:center;font-weight:700}
.cal .off{background:#fafbfd;color:#c4cad4}
.cal .today .dn{background:var(--green);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-grid;place-items:center}
.cal .ev{display:block;margin-top:3px;background:#eaf6ef;color:#256b44;border-radius:5px;padding:2px 5px;font-size:11.5px;line-height:1.3;cursor:pointer}
.cal .ev.big{background:#fdf1e3;color:#9a5512}
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.calhead h3{margin:0}
.calhead .sp{margin-left:auto}
.evlist{margin-top:14px}
.evrow{display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line);padding:11px 2px}
.evdate{width:58px;text-align:center;flex:none}
.evdate b{display:block;font-size:20px;color:var(--navy);line-height:1.1}
.evdate span{font-size:12px;color:var(--sub)}
.evrow .info{flex:1}.evrow .info small{display:block;color:var(--sub)}
.att{font-size:12.5px;color:var(--sub);white-space:nowrap}
.btn.on-att{background:#eaf6ef;border-color:var(--green);color:var(--green);font-weight:700}
.notice{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.notice .nh{display:flex;gap:8px;align-items:center}
.pin{font-size:11.5px;font-weight:700;background:#fdf1e3;color:#b5651d;border-radius:6px;padding:1px 7px}
.notice h3{margin:0;font-size:16px}
.notice .nm{font-size:12.5px;color:var(--sub);margin:3px 0 8px}
.notice .body{white-space:pre-line;font-size:14.5px}
.cmts{margin-top:12px;background:#fafbfd;border-radius:10px;padding:8px 12px}
.cmt{padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.cmt:last-of-type{border-bottom:0}
.cmt b{font-size:13px}.cmt span{color:var(--sub);font-size:12px;margin-left:6px}
.cform{display:flex;gap:6px;margin-top:8px}
.cform input{flex:1;border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.booktools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.booktools input[type=text]{border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:260px}
.bookrow{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.bookrow input{width:17px;height:17px}
.bookrow .info{flex:1}.bookrow small{color:var(--sub)}
#bookView{position:fixed;inset:0;background:#5b6472;z-index:40;overflow-y:auto;display:none}
#bookView.show{display:block}
.bbar{position:sticky;top:0;background:#1f2633;color:#fff;padding:10px 16px;display:flex;gap:8px;align-items:center;z-index:2}
.bbar span{flex:1;font-size:14px}
.page{width:210mm;min-height:297mm;background:#fff;margin:18px auto;padding:22mm 20mm;box-shadow:0 4px 18px rgba(0,0,0,.25);position:relative;font-size:10.5pt}
.page .pno{position:absolute;bottom:10mm;left:0;right:0;text-align:center;font-size:9pt;color:#999}
.bcover{display:flex;flex-direction:column;justify-content:center;background:linear-gradient(160deg,#17325c 0%,#2b5797 65%,#2f8a57 100%);color:#fff}
.bcover .yr{font-size:14pt;opacity:.8;letter-spacing:2px}
.bcover h1{font-size:32pt;margin:8mm 0 4mm;line-height:1.25;font-weight:900}
.bcover .org{margin-top:auto;font-size:14pt;font-weight:700;border-top:1px solid rgba(255,255,255,.4);padding-top:6mm}
.page h2{color:#17325c;font-size:18pt;border-bottom:2px solid #17325c;padding-bottom:3mm;margin:0 0 6mm}
.toc-sec{font-weight:700;color:#2b5797;margin:5mm 0 2mm}
.toc{display:flex;gap:6px;font-size:10.5pt;margin:1.5mm 0}
.toc .dots{flex:1;border-bottom:1px dotted #aaa;margin-bottom:4px}
.bitem{border:1px solid #d5dce8;border-radius:3mm;padding:6mm;margin-bottom:6mm;page-break-inside:avoid}
.bitem .bsec{font-size:9pt;color:#2f8a57;font-weight:700}
.bitem h3{margin:1mm 0 3mm;font-size:14pt;color:#17325c}
.bitem table{font-size:9.5pt;margin-bottom:3mm}
.bitem th{width:24mm;background:#f3f6fb}
.bitem th,.bitem td{border:1px solid #dde3ec;padding:1.5mm 2.5mm}
.bitem .link{font-size:9pt;color:#555;margin-top:3mm}
.bdiv{display:flex;flex-direction:column;justify-content:center;background:#f3f6fb}
.bdiv .dnum{font-size:48pt;font-weight:900;color:#c9d4e6;line-height:1}
.bdiv .dname{font-size:30pt;font-weight:900;color:#17325c;margin:3mm 0 8mm;border-bottom:3px solid #2f8a57;padding-bottom:4mm}
.bdiv .dlist div{font-size:11pt;color:#444;margin:1.5mm 0}
.bhead{position:absolute;top:10mm;left:20mm;right:20mm;text-align:center;font-size:7.5pt;color:#8a8f98;border-bottom:.5px solid #d0d5dd;padding-bottom:1.5mm}
.msph{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#fafbfd,#fafbfd 10px,#f3f5f9 10px,#f3f5f9 20px)}
.mscard{background:#fff;border:1.5px dashed #9aa6b8;border-radius:4mm;padding:12mm 14mm;text-align:center;display:flex;flex-direction:column;gap:2mm;max-width:130mm}
.mscard b{font-size:15pt;color:#17325c}.mscard span{color:#444}.mscard small{color:#888}
.msico{width:16mm;height:16mm;border-radius:3mm;background:#d9534f;color:#fff;font-weight:900;display:grid;place-items:center;margin:0 auto 2mm}
.bnote{max-width:210mm;margin:14px auto 0;color:#e8ecf2;font-size:13px;text-align:center}
.bookrow .status{flex:none}
@media print{
  body>*:not(#bookView){display:none!important}
  #bookView{position:static;background:#fff;display:block}
  .bbar{display:none}
  .page{margin:0;box-shadow:none;page-break-after:always}
  @page{size:A4;margin:0}
}
.box2{background:#eef6f1;border:1px solid #cfe6d8;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px;color:#24543a}
.cite{display:flex;gap:10px;align-items:center;background:#f6f8fc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13px}
.cite div{flex:1}.cite b{display:block;font-size:12px;color:var(--sub)}
.guestbar{display:flex;gap:10px;align-items:center;background:#fff6e8;border:1px solid #f0d9b5;border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:14px;color:#6b4510;flex-wrap:wrap}
.guestbar div{flex:1;min-width:240px}
.logoprev{width:72px;height:72px;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--sub);font-size:12px;text-align:center;background:#fafbfd;overflow:hidden}
.logoprev img{width:100%;height:100%;object-fit:contain}
.protect{margin:14px 0 0;padding-left:18px;font-size:13.5px;color:#475467}.protect li{margin:4px 0}
.lic{font-size:12px;color:var(--sub);margin-top:8px}
.box3{background:#eef3fb;border:1px solid #cfdbef;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:8px;color:#1d3c6e}
footer .flogo{display:inline-block;vertical-align:middle;margin-right:6px;line-height:0}

.notice-bar{background:#fdecea;color:#8a1f11;border-bottom:1px solid #f5c2bb;padding:8px 16px;font-size:13.5px;text-align:center}
.loading{padding:60px;text-align:center;color:var(--sub)}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;z-index:50;font-weight:700;color:var(--navy)}
.busy.show{display:flex}
.status-pill{font-size:12px;border-radius:999px;padding:2px 10px;background:#fdf1e3;color:#b5651d;margin-left:6px}
.chip.main{--c:#17325c;color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,white);background:color-mix(in srgb,var(--c) 9%,white)}
.chip.main.on{background:var(--c);border-color:var(--c);color:#fff}
@media(max-width:700px){
 table.rt,table.rt tbody{display:block;width:100%}
 table.rt tr.rt-head{display:none}
 table.rt tr{display:block;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fff}
 table.rt td{display:flex;gap:10px;border:0;padding:3px 0;font-size:14px;word-break:break-all}
 table.rt td[data-label]::before{content:attr(data-label);flex:none;width:76px;color:var(--sub);font-size:12.5px;padding-top:1px}
 table.rt td.rt-act{justify-content:flex-start!important;text-align:left!important;flex-wrap:wrap;padding-top:8px;white-space:normal!important}
 .panel{padding:14px}
}
.form input[type=tel],.form input[type=date],.form input[type=time]{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.chat{display:grid;grid-template-columns:260px 1fr;gap:14px;align-items:stretch}
.chat-side{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;max-height:640px;overflow-y:auto}
.chat-side h4{margin:14px 6px 6px;font-size:12.5px;color:var(--sub)}
.chat-side .onn{color:var(--green)}
.person{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:10px;font-size:14px;color:var(--text)}
.person:hover{background:#f4f6fa}.person.on{background:#e8eef7}
.person .pn{flex:1;min-width:0}.person small{display:block;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .cnt{font-size:11px;background:var(--orange);color:#fff;border-radius:999px;padding:0 6px}
.dot{width:9px;height:9px;border-radius:50%;background:#c4cad4;flex:none}.dot.live{background:#22a35a;box-shadow:0 0 0 3px #d9f2e3}
.ricon{width:26px;height:26px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900;flex:none}
.side-empty{font-size:12.5px;color:var(--sub);margin:4px 8px}
.chat-main{background:#fff;border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:520px;max-height:640px}
.chat-head{padding:14px 18px;border-bottom:1px solid var(--line)}.chat-head small{display:block;color:var(--sub);font-size:12.5px}
.chat-box{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px;background:#fafbfd}
.chat-empty{color:var(--sub);text-align:center;margin:auto;font-size:14px}
.msg{max-width:78%;align-self:flex-start}.msg.mine{align-self:flex-end;text-align:right}
.mhead{font-size:12px;color:var(--sub);display:flex;gap:6px;align-items:center}.msg.mine .mhead{justify-content:flex-end}.mhead b{color:var(--text)}
.mdel{border:0;background:none;color:var(--sub);font-size:11px;padding:0;text-decoration:underline}
.bubble{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:14.5px;white-space:pre-wrap;word-break:break-word;text-align:left;margin-top:2px}
.msg.mine .bubble{background:var(--navy);border-color:var(--navy);color:#fff}
.chat-input{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chat-input textarea{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:none;font-family:inherit;font-size:14px;min-height:44px;max-height:120px}
.chat-note{font-size:11.5px;color:var(--sub);padding:0 14px 10px}
nav a .cnt{font-size:11px;background:var(--orange);color:#fff;border-radius:999px;padding:0 6px;margin-left:5px}
@media(max-width:760px){.chat{grid-template-columns:1fr}.chat-side{max-height:230px}.chat-main{min-height:460px}}
</style>
</head>
<body>
<div id="setupBar" class="notice-bar" style="display:none"></div>
<header><div class="hwrap">
  <div class="logo" id="logoBox"></div>
  <div class="brand"><h1>전북초등체육교과연구회 자료실</h1><p>선생님들이 함께 만들고 나누는 초등 체육 수업 자료</p></div>
  <div class="hright" id="hright"></div>
</div></header>
<nav><div class="nwrap">
  <a href="#public" data-v="public">자료실</a>
  <a href="#members" data-v="members">회원 공간<span class="lock" id="lockTag">회원</span></a>
  <a href="#mine" data-v="mine" id="navMine">내가 올린 자료</a>
  <a href="#admin" data-v="admin" id="navAdmin">운영진 관리</a>
</div></nav>
<main id="main"><div class="loading">자료를 불러오는 중입니다…</div></main>
<footer><span class="flogo" id="footLogo"></span>전북초등체육교과연구회 · 자료 이용 시 출처를 밝혀 주세요 · 학생 개인정보가 담긴 자료는 올리지 않습니다</footer>
<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div class="busy" id="busy"><span id="busyTxt">처리 중…</span></div>
<script>
/* ===== 설정 (여기 두 줄만 바꾸면 됩니다) ===== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCtc18NQqggoKHnuOqC-3u7uRdF-6Zn73Q",
  authDomain: "jbpe-hub.firebaseapp.com",
  projectId: "jbpe-hub",
  storageBucket: "jbpe-hub.firebasestorage.app",
  messagingSenderId: "715458125549",
  appId: "1:715458125549:web:4ac3ba5743cb7bbaecb6e4"
};
const API_URL = window.JBPE_API_URL || "__API_URL__"; // config.js 에서 설정

/* ===== 로고 ===== */
const SYM_T = '<circle cx="50" cy="15" r="10.5" fill="{o}"/><path d="M5 28 Q50 44 95 28" fill="none" stroke="{n}" stroke-width="10" stroke-linecap="round"/><path d="M52 37 Q49 55 28 63" fill="none" stroke="{n}" stroke-width="10" stroke-linecap="round"/><path d="M13 83 L19 73 L33 78 Q38 75 44 68" fill="none" stroke="{g}" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M53 50 Q69 62 74 89 L86 86" fill="none" stroke="{g}" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>';
const symSvg = (size, n = "#17325C", g = "#2F8A57", o = "#E0862B") =>
  `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="전북초등체육교과연구회 로고">` + SYM_T.replace(/\{n\}/g, n).replace(/\{g\}/g, g).replace(/\{o\}/g, o) + "</svg>";

/* ===== 상태 ===== */
let CFG = { grades: [], areas: [], types: [], bookTitle: "" };
let PUB = [];          // 공개 목록(손님용)
let ME = null;         // 로그인한 사람 정보
let MD = null;         // 회원 데이터(회원만)
let AD = null;         // 운영진 데이터
let view = "public", msub = (window.JBPE_DB_URL ? "chat" : "cal"), calM = new Date();
let f = { q: "", g: [], a: [], ty: [], dl: [], sort: "new" };
let bookSel = new Set(), bookTitle = "", bookMine = false;
calM = new Date(calM.getFullYear(), calM.getMonth(), 1);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TODAY = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; })();
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2800); }
function busy(on, txt) { $("#busyTxt").textContent = txt || "처리 중…"; $("#busy").classList.toggle("show", !!on); }
const isMember = () => !!(ME && ME.member);
const isAdmin = () => !!(ME && ME.admin);

/* ===== 파이어베이스 로그인 ===== */
firebase.initializeApp(Object.assign({}, FIREBASE_CONFIG, window.JBPE_DB_URL ? { databaseURL: window.JBPE_DB_URL } : {}));
const AUTH = firebase.auth();
async function login() {
  try { await AUTH.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch (e) { if (e.code !== "auth/popup-closed-by-user") toast("로그인하지 못했어요: " + (e.message || e.code)); }
}
async function logout() { chatStop(); clearCache(); await AUTH.signOut(); ME = null; MD = null; AD = null; if (["mine", "admin"].includes(view)) go("public"); render(); }

/* ===== 서버 호출 ===== */
const apiReady = () => API_URL && !API_URL.startsWith("__");
async function api(action, data = {}) {
  if (!apiReady()) throw new Error("아직 서버 주소(API_URL)가 설정되지 않았습니다.");
  const token = AUTH.currentUser ? await AUTH.currentUser.getIdToken() : null;
  const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action, token, ...data }) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "서버 오류");
  return j;
}
async function loadPublic(fresh) {
  let j = null;
  if (!fresh) { try { const r = await fetch("data/public.json?t=" + Date.now()); if (r.ok) j = await r.json(); } catch (e) {} }
  if ((!j || !j.ok) && apiReady()) { try { j = await (await fetch(API_URL + "?action=publicList")).json(); } catch (e) {} }
  if (j && j.ok) { CFG = j.config; PUB = j.items; if (!bookTitle) bookTitle = CFG.bookTitle || "연구회 수업 자료집"; }
}
async function loadMember() { if (isMember()) { MD = await api("memberData"); if (AUTH.currentUser) saveCache(AUTH.currentUser.uid); } }
async function loadAdmin() { if (isAdmin()) { AD = await api("adminData"); } }
async function reloadAll(fresh = true) { await loadPublic(fresh); if (isMember()) await loadMember(); if (isAdmin() && view === "admin") await loadAdmin(); render(); }

/* 이 기기에서 로그인 유지 + 새로 고침 때 바로 보이도록 마지막 상태를 기억 */
try { AUTH.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch (e) {}
let authReady = false;
const CK = uid => "jbpe_cache_" + uid;
function saveCache(uid) { try { localStorage.setItem(CK(uid), JSON.stringify({ ME, MD, at: Date.now() })); } catch (e) {} }
function readCache(uid) { try { const c = JSON.parse(localStorage.getItem(CK(uid)) || "null"); return c && Date.now() - c.at < 14 * 864e5 ? c : null; } catch (e) { return null; } }
function clearCache() { try { Object.keys(localStorage).filter(k => k.startsWith("jbpe_cache_")).forEach(k => localStorage.removeItem(k)); } catch (e) {} }

AUTH.onAuthStateChanged(async user => {
  authReady = true;
  if (!user) { chatStop(); ME = null; MD = null; render(); return; }
  const c = readCache(user.uid);
  if (c && c.ME) { ME = c.ME; MD = c.MD; render(); }   // 기억해 둔 화면을 먼저 보여 주고
  try {
    ME = (await api("me")).me;                           // 서버에서 최신 정보로 바꾸기
    if (ME.status === "없음") { render(); openJoin(); return; }
    await loadMember();
    if (view === "admin") await loadAdmin();
    saveCache(user.uid);
  } catch (e) { if (!c) toast(e.message); }
  render();
  if (isMember()) chatStart(); else chatStop();
  askPhone();
});

/* ===== 공통 데이터 ===== */
const allItems = () => (MD ? MD.items : PUB);
const AREA_MAIN = () => CFG.areas.map(A => A.n);
const isAiTag = a => { const ai = CFG.areas.find(A => A.n.startsWith("AI")); return a.startsWith("AI") || (ai && ai.s.includes(a)); };
const AREA_COLORS = ["#2F8A57", "#2B5797", "#C25E12", "#7A4FB5", "#0F7C86", "#9A3D5C"];
const areaStyle = n => { const i = AREA_MAIN().indexOf(n); return i < 0 ? "" : `style="--c:${AREA_COLORS[i % AREA_COLORS.length]}"`; };
const mainArea = it => AREA_MAIN().find(n => it.a.includes(n)) || "기타";

/* ===== 머리 · 메뉴 ===== */
function header() {
  const h = $("#hright");
  if (!ME && !authReady) h.innerHTML = `<span class="who">로그인 확인 중…</span>`;
  else if (!ME) h.innerHTML = `<button class="btn ghost" onclick="openJoin()">가입 신청</button><button class="btn primary" onclick="login()">구글 계정으로 로그인</button>`;
  else {
    const st = ME.member ? "" : `<span class="status-pill">${ME.status === "대기" ? "승인 대기 중" : ME.status === "보류" ? "가입 보류" : "가입 전"}</span>`;
    h.innerHTML = `<span class="who">${ME.admin ? "운영진 " : ""}${esc(ME.name || ME.email)}${ME.name ? " 선생님" : ""}${st}</span>${ME.member ? `<button class="btn primary" onclick="openUpload()">자료 올리기</button>` : (ME.status === "없음" || ME.status === "보류" ? `<button class="btn primary" onclick="openJoin()">가입 신청</button>` : "")}<button class="btn ghost" onclick="logout()">로그아웃</button>`;
  }
  $("#lockTag").style.display = isMember() ? "none" : "";
  $("#navMine").style.display = isMember() ? "" : "none";
  $("#navAdmin").style.display = isAdmin() ? "" : "none";
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.v === view));
}
function go(v) { view = v; try { history.replaceState(null, "", "#" + v); } catch (e) {} }

/* ===== 목록 ===== */
function match(it) {
  if (f.q) { const q = f.q.toLowerCase(); if (!(it.t + it.d + it.by + it.a.join()).toLowerCase().includes(q)) return false; }
  if (f.g.length && !f.g.some(x => it.g.includes(x))) return false;
  if (f.a.length && !f.a.some(x => it.a.includes(x))) return false;
  if (f.ty.length && !f.ty.includes(it.ty)) return false;
  if (f.dl.length && !f.dl.includes(it.m ? "회원만 받기" : "누구나 받기")) return false;
  return true;
}
function tog(k, x) { const i = f[k].indexOf(x); i < 0 ? f[k].push(x) : f[k].splice(i, 1); render(); }
function chipRow(list, key) { return list.map(x => `<button class="chip ${f[key].includes(x) ? "on" : ""}" onclick='tog("${key}",${JSON.stringify(x)})'>${esc(x)}</button>`).join(""); }
function filters() {
  return `<aside>
   <h4>학년</h4><div class="chips">${chipRow(CFG.grades, "g")}</div>
   <h4>영역</h4>
   ${CFG.areas.map(A => `<div class="area-group"><button class="chip main ${f.a.includes(A.n) ? "on" : ""}" ${areaStyle(A.n)} onclick='tog("a",${JSON.stringify(A.n)})'>${esc(A.n)}</button>${A.s.length ? `<div class="subs">${chipRow(A.s, "a")}</div>` : ""}</div>`).join("")}
   <h4>자료 종류</h4><div class="chips">${chipRow(CFG.types, "ty")}</div>
   <h4>내려받기</h4><div class="chips">${chipRow(["누구나 받기", "회원만 받기"], "dl")}</div>
   <button class="btn reset" onclick="f={q:'',g:[],a:[],ty:[],dl:[],sort:f.sort};render()">필터 모두 지우기</button>
  </aside>`;
}
function card(it) {
  const isNew = (new Date(TODAY) - new Date(it.dt)) / 864e5 < 7;
  return `<div class="card" onclick='openItem(${JSON.stringify(it.id)})'>
   <div class="ctop"><span class="type">${esc(it.ty)}</span>${it.m ? `<span class="memb">${isMember() ? "회원만 받기" : "회원만 받기 · 잠김"}</span>` : ""}${isNew ? '<span class="new">NEW</span>' : ""}</div>
   <h3>${esc(it.t)}</h3><p>${esc(it.d)}</p>
   <div class="tags">${it.g.map(g => `<span class="tag">${esc(g)}</span>`).join("")}${it.a.map(a => `<span class="tag ${isAiTag(a) ? "ai" : ""}">${esc(a)}</span>`).join("")}</div>
   <div class="cfoot"><span>${esc(it.by)} · ${esc(it.sc)}</span><span>${esc((it.dt || "").slice(5).replace("-", "."))} · 조회 ${it.v}</span></div></div>`;
}
function listView(src, title, desc) {
  let list = src.filter(match);
  list.sort(f.sort === "pop" ? (a, b) => b.v - a.v : (a, b) => b.dt.localeCompare(a.dt));
  const ai = src.filter(i => i.a.some(isAiTag)).length, teachers = new Set(src.map(i => i.by)).size;
  return `<div class="hero"><div><h2>${title}</h2><p>${desc}</p></div>
   <div class="stats"><div class="stat"><b>${src.length}</b><span>전체 자료</span></div><div class="stat"><b>${ai}</b><span>AI·에듀테크</span></div><div class="stat"><b>${teachers}</b><span>나눈 선생님</span></div></div></div>
   <div class="layout">${filters()}<section>
    <div class="toolbar"><input class="search" id="q" placeholder="자료 이름, 내용, 선생님 이름으로 찾기" value="${esc(f.q)}">
     <select id="sort"><option value="new" ${f.sort === "new" ? "selected" : ""}>최신순</option><option value="pop" ${f.sort === "pop" ? "selected" : ""}>많이 본 순</option></select></div>
    <div class="count">${list.length}개 자료</div>
    ${list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<div class="empty">${src.length ? "조건에 맞는 자료가 없습니다. 필터를 줄여 보세요." : "아직 올라온 자료가 없습니다."}</div>`}
   </section></div>`;
}

/* ===== 화면 그리기 ===== */
function render() {
  header();
  const m = $("#main");
  if (view === "public") {
    const lockedN = allItems().filter(i => i.m).length;
    m.innerHTML = (!isMember() && lockedN ? `<div class="guestbar"><div><b>"회원만 받기" 자료 ${lockedN}개</b>는 연구회 회원이 되면 내려받을 수 있어요. 목록과 설명은 누구나 볼 수 있고, 산출물 제출 의무 없이 가입할 수 있습니다.</div>${ME ? "" : `<button class="btn" onclick="login()">로그인</button>`}${!ME || ME.status === "없음" ? `<button class="btn primary" onclick="openJoin()">가입 신청</button>` : `<span class="status-pill">${ME.status === "대기" ? "승인 대기 중" : "가입 " + esc(ME.status)}</span>`}</div>` : "")
      + listView(allItems(), "자료실", "연구회 선생님들이 함께 만들고 나누는 수업 자료입니다. 자료마다 누구나 받을 수 있는지, 회원만 받을 수 있는지 표시되어 있어요.");
  }
  else if (view === "members") {
    if (!isMember()) m.innerHTML = memberTabs() + `<div class="gate"><div class="gicon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b5651d" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div><h2>회원만 볼 수 있어요</h2><p>회원 대화방·쪽지, 자율연수 일정, 공지, 산출물 책자는 승인된 회원에게만 열립니다.<br>산출물 제출 의무 없이 가입할 수 있어요.</p>${ME ? "" : `<button class="btn primary" onclick="login()">구글 계정으로 로그인</button> `}<button class="btn" onclick="openJoin()">가입 신청</button></div>`;
    else m.innerHTML = memberTabs() + (msub === "chat" ? chatView() : msub === "cal" ? calView() : msub === "notice" ? noticeView() : bookView());
  }
  else if (view === "mine") {
    if (!isMember()) { go("public"); return render(); }
    const mine = MD.items.filter(i => i.own);
    m.innerHTML = `<div class="panel"><h3>내가 올린 자료 (${mine.length})</h3>${mine.length ? `<table class="rt"><tr><th>자료</th><th>내려받기</th><th>올린 날</th><th>조회</th><th></th></tr>${mine.map(i => `<tr><td>${esc(i.t)}</td><td>${i.m ? '<span class="status st-wait">회원만</span>' : '<span class="status st-ok">누구나</span>'}</td><td>${esc(i.dt)}</td><td>${i.v}</td><td style="text-align:right"><button class="btn mini" onclick='flip(${JSON.stringify(i.id)})'>${i.m ? "누구나 받기로" : "회원만 받기로"}</button> <button class="btn mini" onclick='hideItem(${JSON.stringify(i.id)})'>내리기</button></td></tr>`).join("")}</table>` : '<p style="color:var(--sub)">아직 올린 자료가 없습니다.</p>'}</div>`;
  }
  else if (view === "admin") {
    if (!isAdmin()) { go("public"); return render(); }
    m.innerHTML = AD ? adminView() : `<div class="loading">불러오는 중…</div>`;
    if (!AD) loadAdmin().then(render).catch(e => toast(e.message));
  }
  labelTables();
  chatBadge();

/* 워터마크: 쪽 크기에 맞춘 투명 그림을 만들어 위에 덮기 */
function symPng(px) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => { const c = document.createElement("canvas"); c.width = c.height = px; c.getContext("2d").drawImage(img, 0, 0, px, px); res(c); }; img.onerror = rej; img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(symSvg(px)); });
}
async function overlayPng(W, H, foot) {
  const s = 2, c = document.createElement("canvas"); c.width = Math.round(W * s); c.height = Math.round(H * s);
  const x = c.getContext("2d");
  try { const logo = await symPng(240); x.globalAlpha = 0.07; const L = Math.min(W, H) * 0.32 * s; x.drawImage(logo, (c.width - L) / 2, c.height / 2 - L * 1.05, L, L); } catch (e) {}
  x.globalAlpha = 0.09; x.fillStyle = "#17325C"; x.textAlign = "center"; x.textBaseline = "middle";
  x.font = `700 ${Math.round(Math.min(W, H) * 0.075 * s)}px "Noto Sans KR", sans-serif`;
  x.save(); x.translate(c.width / 2, c.height / 2); x.rotate(-Math.atan2(H, W)); x.fillText("전북초등체육교과연구회", 0, 0); x.restore();
  x.globalAlpha = 1; x.fillStyle = "#9aa1ab"; x.font = `500 ${7 * s}px "Noto Sans KR", sans-serif`; x.fillText(foot, c.width / 2, c.height - 12 * s);
  return c.toDataURL("image/png");
}
async function watermark(bytes) {
  const doc = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
  const foot = `${ME.name || ME.email} 선생님 · ${TODAY} 내려받음 · 전북초등체육교과연구회 자료실 · 무단 전재·배포 금지`;
  const cache = {};
  for (const pg of doc.getPages()) {
    const { width: W, height: H } = pg.getSize(), k = `${Math.round(W)}x${Math.round(H)}`;
    if (!cache[k]) cache[k] = await doc.embedPng(await overlayPng(W, H, foot));
    pg.drawImage(cache[k], { x: 0, y: 0, width: W, height: H });
  }
  return await doc.save();
}

async function gotMs(inp) {
  const file = inp.files[0]; if (!file) return;

  try {
    busy(true, "원고를 올리는 중…");
    const bytes = new Uint8Array(await file.arrayBuffer());
    const pages = (await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true })).getPageCount();
    await api("uploadMs", { id: msTarget, b64: await fileToB64(file), pages });
    bookSel.add(msTarget); await loadMember(); render(); toast(`원고를 올렸습니다 (${pages}쪽). 운영진 검토를 기다립니다`);
  } catch (e) { toast(e.message.includes("PDF") ? e.message : "원고를 올리지 못했어요: " + e.message); } finally { busy(false); }
}

let BOOK = null;
function planBook() {
  const sel = MD.items.filter(i => bookSel.has(i.id)), order = AREA_MAIN();
  sel.sort((a, b) => order.indexOf(mainArea(a)) - order.indexOf(mainArea(b)) || (!!b.ms - !!a.ms) || a.dt.localeCompare(b.dt));
  const groups = [...order, "기타"].map(n => ({ n, list: sel.filter(i => mainArea(i) === n) })).filter(g => g.list.length);
  const pages = [{ k: "cover" }, { k: "toc" }];
  groups.forEach(g => {
    pages.push({ k: "div", g });
    g.list.filter(i => i.ms).forEach(i => { for (let p = 0; p < i.ms.pages; p++) pages.push({ k: "ms", it: i, p, area: g.n }); });
    const noMs = g.list.filter(i => !i.ms);
    for (let k = 0; k < noMs.length; k += 2) pages.push({ k: "sum", list: noMs.slice(k, k + 2), area: g.n });
  });
  pages.forEach((p, i) => p.no = i + 1);
  const startOf = it => pages.find(p => (p.k === "ms" && p.it === it && p.p === 0) || (p.k === "sum" && p.list.includes(it))).no;
  const divOf = g => pages.find(p => p.k === "div" && p.g === g).no;
  return { sel, groups, pages, startOf, divOf };
}
function pageHTML(P, B) {
  const pno = `<div class="pno">${P.no}</div>`;
  if (P.k === "cover") return `<div class="page bcover"><div class="yr">연구회 산출물</div><h1>${esc(bookTitle)}</h1><div style="font-size:12pt;opacity:.85">자료 ${B.sel.length}편 · ${B.groups.map(g => `${esc(g.n)} ${g.list.length}`).join(" · ")}</div><div class="org"><span style="display:inline-block;vertical-align:middle;margin-right:4mm;background:#fff;border-radius:3mm;padding:1.5mm;line-height:0">${symSvg(48)}</span>전북초등체육교과연구회</div></div>`;

    const pm = MD.members.filter(m => m.book && !teachers.includes(m.n));
    return `<div class="page"><h2>차례</h2>${B.groups.map(g => `<div class="toc-sec"><div class="toc"><span>${esc(g.n)}</span><span class="dots"></span><span>${B.divOf(g)}</span></div></div>${g.list.map(i => `<div class="toc" style="padding-left:5mm"><span>${esc(i.t)} <span style="color:#888;font-size:9pt">${esc(i.by)}</span></span><span class="dots"></span><span>${B.startOf(i)}</span></div>`).join("")}`).join("")}
     <div style="margin-top:10mm;font-size:10pt;color:#444"><b>자료를 만든 선생님</b><br>${teachers.map(esc).join(", ")}</div>
     ${pm.length ? `<div style="margin-top:5mm;font-size:10pt;color:#444"><b>함께한 참여 회원</b><br>${pm.map(m => `${esc(m.n)}(${esc(m.sc)})`).join(", ")}</div>` : ""}${pno}</div>`;
  }
  if (P.k === "div") return `<div class="page bdiv"><div class="dnum">${String(B.groups.indexOf(P.g) + 1).padStart(2, "0")}</div><div class="dname">${esc(P.g.n)}</div><div class="dlist">${P.g.list.map(i => `<div>${esc(i.t)} · ${esc(i.by)}</div>`).join("")}</div>${pno}</div>`;
  if (P.k === "sum") return `<div class="page"><div class="bhead">${esc(bookTitle)} · ${esc(P.area)}</div>${P.list.map(i => `<div class="bitem"><div class="bsec">${esc(i.a.join(" · "))}</div><h3>${esc(i.t)}</h3>
    <table><tr><th>대상 학년</th><td>${esc(i.g.join(", "))}</td><th>자료 종류</th><td>${esc(i.ty)}</td></tr><tr><th>만든 선생님</th><td colspan="3">${esc(i.by)} (${esc(i.sc)})</td></tr></table>
    <div style="white-space:pre-line">${esc(i.d)}</div><div class="link">자료 위치: 전북초등체육교과연구회 자료실${i.m ? " (회원만 받기)" : ""} · ${esc(i.dt)} 등록</div></div>`).join("")}${pno}</div>`;
  if (P.k === "ms") return `<div class="page msph"><div class="bhead">${esc(bookTitle)} · ${esc(P.area)}</div><div class="mscard"><div class="msico">PDF</div><b>${esc(P.it.t)}</b><span>${esc(P.it.by)} 선생님 원고 · ${P.p + 1} / ${P.it.ms.pages}쪽</span><small>합친 PDF에는 이 자리에 원고 원본 쪽이 그대로 들어갑니다</small></div>${pno}</div>`;
}
function makeBook() {
  BOOK = planBook();
  if (!BOOK.sel.length) return toast("책자에 넣을 자료를 하나 이상 골라 주세요");
  const notOk = BOOK.sel.filter(i => i.ms && i.ms.st !== "ok").length;
  const html = BOOK.pages.filter(p => !(p.k === "ms" && p.p > 0)).map(p => pageHTML(p, BOOK)).join("");
  let bv = $("#bookView"); if (!bv) { bv = document.createElement("div"); bv.id = "bookView"; document.body.appendChild(bv); }
  bv.innerHTML = `<div class="bbar"><span>${esc(bookTitle)} · 표지 포함 ${BOOK.pages.length}쪽${notOk ? ` · <b style="color:#ffcf8f">검토 전 원고 ${notOk}편 포함</b>` : ""}</span><button class="btn mini primary" id="mkPdf" onclick="buildPdf()">합친 PDF 받기</button><button class="btn mini" onclick="document.getElementById('bookView').classList.remove('show')">닫기</button></div>
   <div class="bnote">미리보기에서 원고는 첫 쪽 자리만 보여 줍니다. '합친 PDF 받기'를 누르면 원고 원본 쪽이 모두 들어간 한 권의 PDF가 만들어집니다.</div>${html}`;
  bv.classList.add("show"); bv.scrollTop = 0;
}
function textPng(txt, px, color) {
  const c = document.createElement("canvas"), s = 4, ctx = c.getContext("2d");
  ctx.font = `500 ${px * s}px "Noto Sans KR",sans-serif`; const w = Math.ceil(ctx.measureText(txt).width) + 8;
  c.width = w; c.height = Math.ceil(px * s * 1.5); ctx.font = `500 ${px * s}px "Noto Sans KR",sans-serif`; ctx.fillStyle = color; ctx.textBaseline = "middle"; ctx.fillText(txt, 4, c.height / 2);
  return { url: c.toDataURL("image/png"), w: w / s, h: c.height / s };
}
async function buildPdf() {
  const btn = $("#mkPdf"); btn.disabled = true;
  try {
    const { PDFDocument, rgb } = PDFLib, out = await PDFDocument.create(), A4 = [595.28, 841.89];
    const stage = document.createElement("div"); stage.style.cssText = "position:fixed;left:-10000px;top:0;"; document.body.appendChild(stage);
    const loaded = new Map();
    for (const P of BOOK.pages) {
      btn.textContent = `만드는 중 ${P.no}/${BOOK.pages.length}`;
      if (P.k === "ms") {
        let src = loaded.get(P.it.id);
        if (!src) { const r = await api("getFile", { id: P.it.id, kind: "ms" }); src = await PDFDocument.load(b64ToBytes(r.b64), { ignoreEncryption: true }); loaded.set(P.it.id, src); }
        if (P.p >= src.getPageCount()) continue;
        const [emb] = await out.embedPdf(src, [P.p]); const pg = out.addPage(A4);
        const sc = Math.min(A4[0] / emb.width, A4[1] / emb.height);
        pg.drawPage(emb, { x: (A4[0] - emb.width * sc) / 2, y: (A4[1] - emb.height * sc) / 2, xScale: sc, yScale: sc });
        const hd = textPng(`${bookTitle} · ${P.area}`, 7.5, "#8a8f98"), hi = await out.embedPng(hd.url);
        pg.drawImage(hi, { x: (A4[0] - hd.w) / 2, y: A4[1] - 30, width: hd.w, height: hd.h });
        pg.drawLine({ start: { x: 56, y: A4[1] - 34 }, end: { x: A4[0] - 56, y: A4[1] - 34 }, thickness: .4, color: rgb(.8, .82, .86) });
        const nm = textPng(String(P.no), 9, "#777777"), ni = await out.embedPng(nm.url);
        pg.drawImage(ni, { x: (A4[0] - nm.w) / 2, y: 22, width: nm.w, height: nm.h });
      } else {
        stage.innerHTML = pageHTML(P, BOOK); const el = stage.firstElementChild; el.style.margin = "0"; el.style.boxShadow = "none";
        const cv = await html2canvas(el, { scale: 2, backgroundColor: "#ffffff", logging: false });
        out.addPage(A4).drawImage(await out.embedJpg(cv.toDataURL("image/jpeg", .9)), { x: 0, y: 0, width: A4[0], height: A4[1] });
      }
    }
    stage.remove(); out.setTitle(bookTitle); out.setAuthor("전북초등체육교과연구회");
    saveBlob(await out.save(), `${bookTitle}.pdf`);
    toast(`책자 PDF를 내려받았습니다 (${BOOK.pages.length}쪽)`);
  } catch (e) { console.error(e); toast("PDF를 만드는 중 문제가 생겼어요: " + (e.message || e)); }
  finally { btn.disabled = false; btn.textContent = "합친 PDF 받기"; }
}

const CHAT = { on: false, db: null, uid: null, members: {}, status: {}, inbox: {}, room: [], dm: {}, active: "room", refs: [], dmRef: null, err: "" };
const chatReady = () => !!(window.JBPE_DB_URL && firebase.database);
const cidOf = other => [CHAT.uid, other].sort().join("_");
const tFmt = t => { if (!t) return ""; const d = new Date(t), now = new Date(); const hm = `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`; return d.toDateString() === now.toDateString() ? hm : `${d.getMonth() + 1}.${d.getDate()} ${hm}`; };
const unreadN = () => Object.values(CHAT.inbox).filter(v => v && v.unread).length;

function chatStart() {
  if (CHAT.on || !chatReady() || !isMember() || !AUTH.currentUser) return;
  CHAT.on = true; CHAT.uid = AUTH.currentUser.uid; CHAT.db = firebase.database();
  const db = CHAT.db, me = CHAT.uid;
  const fail = e => { CHAT.err = "대화 기능에 연결하지 못했어요. 잠시 뒤 새로 고침해 주세요."; console.warn(e); if (msub === "chat") render(); };
  // 접속 표시
  const conn = db.ref(".info/connected"), stRef = db.ref("status/" + me);
  conn.on("value", s => {
    if (s.val() !== true) return;
    stRef.onDisconnect().update({ state: "off", t: firebase.database.ServerValue.TIMESTAMP }).then(() =>
      stRef.set({ state: "on", t: firebase.database.ServerValue.TIMESTAMP, n: ME.name || "", sc: ME.school || "" })).catch(fail);
  });
  CHAT.refs.push(conn);
  const mRef = db.ref("members"); mRef.on("value", s => { CHAT.members = s.val() || {}; chatPaint(); }, fail); CHAT.refs.push(mRef);
  const sRef = db.ref("status"); sRef.on("value", s => { CHAT.status = s.val() || {}; chatPaint(); }, fail); CHAT.refs.push(sRef);
  const iRef = db.ref("inbox/" + me); iRef.on("value", s => { CHAT.inbox = s.val() || {}; chatBadge(); chatPaint(); }, fail); CHAT.refs.push(iRef);
  const rRef = db.ref("room").orderByChild("t").limitToLast(150);
  rRef.on("child_added", s => { CHAT.room.push({ id: s.key, ...s.val() }); if (CHAT.active === "room") chatAppend(); });
  rRef.on("child_removed", s => { CHAT.room = CHAT.room.filter(m => m.id !== s.key); if (CHAT.active === "room") chatPaint(); });
  CHAT.refs.push(rRef);
}
function chatStop() {
  if (!CHAT.on) return;
  try { CHAT.db.ref("status/" + CHAT.uid).update({ state: "off", t: firebase.database.ServerValue.TIMESTAMP }); } catch (e) {}
  CHAT.refs.forEach(r => r.off()); if (CHAT.dmRef) CHAT.dmRef.off();
  Object.assign(CHAT, { on: false, refs: [], dmRef: null, members: {}, status: {}, inbox: {}, room: [], dm: {}, active: "room", err: "" });
  chatBadge();
}
function chatBadge() {
  const n = unreadN(), a = document.querySelector('nav a[data-v="members"]');
  if (!a) return;
  let b = a.querySelector(".cnt"); if (!n) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement("span"); b.className = "cnt"; a.appendChild(b); }
  b.textContent = n;
}
function openDm(uid) {
  CHAT.active = uid;
  if (CHAT.dmRef) CHAT.dmRef.off();
  const cid = cidOf(uid); CHAT.dm[cid] = [];
  CHAT.dmRef = CHAT.db.ref("dm/" + cid).orderByChild("t").limitToLast(200);
  CHAT.dmRef.on("child_added", s => { (CHAT.dm[cid] = CHAT.dm[cid] || []).push({ id: s.key, ...s.val() }); if (CHAT.active === uid) chatAppend(); });
  if (CHAT.inbox[uid] && CHAT.inbox[uid].unread) CHAT.db.ref(`inbox/${CHAT.uid}/${uid}/unread`).set(false);
  msub = "chat"; go("members"); render();
}
function openRoom() { CHAT.active = "room"; if (CHAT.dmRef) { CHAT.dmRef.off(); CHAT.dmRef = null; } render(); }

async function chatSend() {
  const inp = $("#chatIn"); if (!inp) return;
  const x = inp.value.trim(); if (!x) return;
  if (x.length > 1000) return toast("1000자까지 보낼 수 있어요");
  const T = firebase.database.ServerValue.TIMESTAMP, msg = { uid: CHAT.uid, n: ME.name || ME.email, x, t: T };
  inp.value = ""; inp.focus();
  try {
    if (CHAT.active === "room") await CHAT.db.ref("room").push(msg);
    else {
      const other = CHAT.active, cid = cidOf(other), on = CHAT.members[other] || {};
      await CHAT.db.ref("dm/" + cid).push(msg);
      const last = x.slice(0, 60);
      await CHAT.db.ref(`inbox/${other}/${CHAT.uid}`).set({ n: ME.name || ME.email, last, t: T, unread: true });
      await CHAT.db.ref(`inbox/${CHAT.uid}/${other}`).set({ n: on.n || "", last, t: T, unread: false });
    }
  } catch (e) { inp.value = x; toast("보내지 못했어요: " + (e.message || e.code)); }
}
async function delRoomMsg(id) { try { await CHAT.db.ref("room/" + id).remove(); } catch (e) { toast("지우지 못했어요"); } }

function msgHTML(m) {
  const mine = m.uid === CHAT.uid, adminDel = CHAT.active === "room" && (mine || isAdmin());
  return `<div class="msg ${mine ? "mine" : ""}"><div class="mhead">${mine ? "" : `<b>${esc(m.n)}</b>`}<span>${tFmt(m.t)}</span>${adminDel ? `<button class="mdel" onclick='delRoomMsg(${JSON.stringify(m.id)})' aria-label="메시지 지우기">지우기</button>` : ""}</div><div class="bubble">${esc(m.x)}</div></div>`;
}
function curMsgs() { return CHAT.active === "room" ? CHAT.room : (CHAT.dm[cidOf(CHAT.active)] || []); }
function chatAppend() {
  const box = $("#chatBox"); if (!box) return;
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  box.innerHTML = curMsgs().map(msgHTML).join("") || `<div class="chat-empty">${CHAT.active === "room" ? "아직 대화가 없어요. 첫 인사를 남겨 보세요." : "아직 주고받은 쪽지가 없어요."}</div>`;
  if (near) box.scrollTop = box.scrollHeight;
  if (CHAT.active !== "room" && CHAT.inbox[CHAT.active] && CHAT.inbox[CHAT.active].unread) CHAT.db.ref(`inbox/${CHAT.uid}/${CHAT.active}/unread`).set(false);
}
let paintTimer = null;
function chatPaint() { if (view !== "members" || msub !== "chat") return; clearTimeout(paintTimer); paintTimer = setTimeout(() => { const side = $("#chatSide"); if (side) side.innerHTML = chatSideHTML(); else render(); }, 60); }

function chatSideHTML() {
  const ids = Object.keys(CHAT.members).filter(u => u !== CHAT.uid);
  const online = ids.filter(u => CHAT.status[u] && CHAT.status[u].state === "on");
  const convs = Object.entries(CHAT.inbox).sort((a, b) => (b[1].t || 0) - (a[1].t || 0));
  const person = u => { const m = CHAT.members[u] || {}, on = online.includes(u), ib = CHAT.inbox[u];
    return `<button class="person ${CHAT.active === u ? "on" : ""}" onclick='openDm(${JSON.stringify(u)})'><span class="dot ${on ? "live" : ""}" aria-label="${on ? "접속 중" : "접속 안 함"}"></span><span class="pn">${esc(m.n || "회원")}<small>${esc(m.sc || "")}</small></span>${ib && ib.unread ? '<span class="cnt">N</span>' : ""}</button>`; };
  return `<button class="person room ${CHAT.active === "room" ? "on" : ""}" onclick="openRoom()"><span class="ricon" aria-hidden="true">#</span><span class="pn">전체 대화방<small>회원 모두가 함께</small></span></button>
   ${convs.length ? `<h4>쪽지</h4>${convs.map(([u, c]) => `<button class="person ${CHAT.active === u ? "on" : ""}" onclick='openDm(${JSON.stringify(u)})'><span class="dot ${online.includes(u) ? "live" : ""}"></span><span class="pn">${esc((CHAT.members[u] || {}).n || c.n || "회원")}<small>${esc(c.last || "")}</small></span>${c.unread ? '<span class="cnt">N</span>' : ""}</button>`).join("")}` : ""}
   <h4>지금 접속 중 <span class="onn">${online.length}명</span></h4>${online.length ? online.map(person).join("") : '<p class="side-empty">지금 접속한 다른 회원이 없어요</p>'}
   <h4>접속 안 한 회원</h4>${ids.filter(u => !online.includes(u)).sort((a, b) => String((CHAT.members[a] || {}).n).localeCompare(String((CHAT.members[b] || {}).n), "ko")).map(person).join("") || '<p class="side-empty">모두 접속 중이에요</p>'}`;
}
function chatView() {
  if (!chatReady()) return `<div class="empty">대화 기능은 운영진이 실시간 데이터베이스를 연결하면 열립니다.</div>`;
  chatStart();
  if (CHAT.err) return `<div class="empty">${esc(CHAT.err)}</div>`;
  const title = CHAT.active === "room" ? "전체 대화방" : `${esc((CHAT.members[CHAT.active] || {}).n || "회원")} 선생님과 쪽지`;
  const sub = CHAT.active === "room" ? "회원 모두가 보는 대화방이에요. 서로 존중하는 말로 이야기해 주세요." : ((CHAT.status[CHAT.active] || {}).state === "on" ? "지금 접속 중이에요. 바로 주고받을 수 있어요." : "지금은 접속해 있지 않아요. 남긴 쪽지는 다음에 접속하면 볼 수 있어요.");
  setTimeout(chatAppend, 0);
  return `<div class="chat"><aside class="chat-side" id="chatSide">${chatSideHTML()}</aside>
   <section class="chat-main"><div class="chat-head"><b>${title}</b><small>${sub}</small></div>
   <div class="chat-box" id="chatBox" aria-live="polite"></div>
   <div class="chat-input"><textarea id="chatIn" rows="1" placeholder="메시지를 입력하세요 (Enter 보내기, Shift+Enter 줄바꿈)" aria-label="메시지" onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();chatSend()}"></textarea><button class="btn primary" onclick="chatSend()">보내기</button></div>
   <div class="chat-note">대화 내용은 연구회 공용 계정의 파이어베이스에 저장되며, 운영진이 관리를 위해 볼 수 있습니다.</div></section></div>`;
}

/* ===== 운영진 관리 ===== */
function adminView() {
  const w = AD.members.filter(j => j.s === "대기").length, regN = AD.members.filter(j => j.s === "승인" && j.reg && !isSysAcct(j)).length;
  const st = s => s === "승인" ? "st-ok" : s === "대기" ? "st-wait" : "st-no";
  return `<div class="panel"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap"><h3 style="margin:0">회원 (승인 대기 ${w}명)</h3><span style="margin-left:auto;font-size:13px;color:var(--sub)">도 등록 명단 동의 ${regN}명</span><button class="btn mini ok" onclick="copyRoster()">도 등록 명단 복사</button></div>
   <div style="overflow-x:auto"><table class="rt"><tr><th>이름</th><th>소속</th><th>구글 계정</th><th>전화번호</th><th>신청일</th><th>도 명단</th><th>책자 이름</th><th>역할</th><th>상태</th><th></th></tr>
   ${AD.members.map(j => { const em = JSON.stringify(j.email); return `<tr><td>${esc(j.n)}</td><td>${esc(j.sc)}</td><td>${esc(j.email)}</td><td>${isSysAcct(j) ? '<span style="color:var(--sub)">-</span>' : j.phone ? esc(j.phone) : '<span style="color:var(--sub)">없음</span>'}</td><td>${esc(j.dt)}</td><td>${j.reg ? "동의" : "-"}</td><td>${j.book ? "동의" : "-"}</td><td>${esc(j.role)}</td><td><span class="status ${st(j.s)}">${esc(j.s)}</span></td>
    <td style="text-align:right;white-space:nowrap">${j.s !== "승인" ? `<button class="btn mini ok" onclick='judge(${em},"승인")'>승인</button> ` : ""}${j.s === "대기" ? `<button class="btn mini" onclick='judge(${em},"보류")'>보류</button>` : ""}${j.s === "승인" ? `<button class="btn mini" onclick='judge(${em},"승인","${j.role === "운영진" ? "회원" : "운영진"}")'>${j.role === "운영진" ? "운영진 해제" : "운영진으로"}</button> <button class="btn mini" onclick='judge(${em},"보류")'>해제</button>` : ""}</td></tr>`; }).join("")}</table></div>
   <div class="sheetnote">승인하면 회원 전용 드라이브 폴더 보기 권한이 자동으로 주어지고, 해제하면 회수됩니다. 전체 기록은 <a href="${esc(AD.sheetUrl)}" target="_blank" rel="noopener">관리 시트</a>에서 볼 수 있어요.</div></div>
   <div class="panel"><h3>내려받기 기록 (최근 30건)</h3>${AD.log.length ? `<table class="rt"><tr><th>일시</th><th>선생님</th><th>자료</th></tr>${AD.log.map(l => `<tr><td>${esc(l.at)}</td><td>${esc(l.n)}</td><td>${esc(l.t)}</td></tr>`).join("")}</table>` : '<p style="color:var(--sub)">아직 기록이 없습니다.</p>'}</div>
   <div class="panel"><h3>자료 관리</h3><p style="margin:0;font-size:14px;color:var(--sub)">운영진은 모든 자료의 내려받기 범위를 바꾸거나 목록에서 내릴 수 있어요. 분류 목록(학년·영역·자료 종류)과 책자 제목은 관리 시트 "설정" 탭에서 고칩니다.</p>
   <div style="overflow-x:auto;margin-top:10px"><table class="rt"><tr><th>자료</th><th>올린 선생님</th><th>내려받기</th><th></th></tr>${(MD ? MD.items : []).slice().sort((a, b) => b.dt.localeCompare(a.dt)).map(i => `<tr><td>${esc(i.t)}</td><td>${esc(i.by)}</td><td>${i.m ? '<span class="status st-wait">회원만</span>' : '<span class="status st-ok">누구나</span>'}</td><td style="text-align:right;white-space:nowrap"><button class="btn mini" onclick='flip(${JSON.stringify(i.id)})'>${i.m ? "누구나 받기로" : "회원만 받기로"}</button> <button class="btn mini" onclick='hideItem(${JSON.stringify(i.id)})'>내리기</button></td></tr>`).join("")}</table></div></div>`;
}
async function judge(email, status, role) {
  try { busy(true); AD = await api("judge", { email, status, role }); await loadMember(); render(); toast(status === "승인" ? "처리했습니다. 회원 전용 폴더 권한이 맞춰졌어요" : "처리했습니다"); }
  catch (e) { toast(e.message); } finally { busy(false); }
}
const isSysAcct = j => j.n === "연구회 공용 계정" || j.sc === "전북초등체육교과연구회";
function copyRoster() {
  const t = ["연번\t이름\t소속\t전화번호"].concat(AD.members.filter(j => j.s === "승인" && j.reg && !isSysAcct(j)).map((j, k) => `${k + 1}\t${j.n}\t${j.sc}\t${j.phone || ""}`)).join("\n");
  copyText(t, "승인·동의한 회원 명단을 복사했습니다. 한글이나 엑셀 표에 붙여 넣으세요");
}

/* ===== 시작 ===== */
function route() {
  const h = location.hash.replace("#", "");
  view = ["public", "members", "mine", "admin"].includes(h) ? h : "public";
  render();
}
window.addEventListener("hashchange", route);
$("#logoBox").innerHTML = symSvg(38);
$("#footLogo").innerHTML = symSvg(22);
if (!apiReady()) { const b = $("#setupBar"); b.style.display = "block"; b.textContent = "설치 중: 서버 주소(API_URL)가 아직 연결되지 않았습니다. 설치를 마치면 이 줄이 사라집니다."; }
loadPublic(false).then(route);

</script>
</body>
</html>
