<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>서버 코드 복사 — 전북초등체육교과연구회 자료실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
body{margin:0;font-family:"Noto Sans KR",sans-serif;background:#f4f6fa;color:#1f2633;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:24px 18px 60px}
h1{font-size:20px;color:#17325c;margin:0 0 6px}
p{margin:0 0 12px;font-size:15px}
button{font-family:inherit;font-size:18px;font-weight:700;width:100%;padding:18px;border:0;border-radius:14px;background:#2f8a57;color:#fff;cursor:pointer}
button:disabled{background:#9aa1ab}
#msg{margin:12px 0 20px;font-weight:700;color:#17325c;min-height:24px}
ol{padding-left:20px;font-size:15px;background:#fff;border:1px solid #dde3ec;border-radius:14px;padding:16px 16px 16px 36px}
li{margin:6px 0}
textarea{width:100%;height:160px;font-size:12px;border:1px solid #dde3ec;border-radius:10px;padding:8px;box-sizing:border-box;display:none;margin-top:10px}
small{color:#667085}
</style>
</head>
<body>
<main>
<h1>자료실 서버 코드 복사</h1>
<p>버튼을 누르면 최신 서버 코드 전체가 복사됩니다.</p>
<button id="b" disabled>불러오는 중…</button>
<div id="msg"></div>
<textarea id="t" readonly aria-label="서버 코드"></textarea>
<ol>
<li>Apps Script 편집 화면 왼쪽 <b>파일</b> 옆 <b>+</b> → <b>스크립트</b> → 이름 <b>서버</b>로 새 파일을 만듭니다.</li>
<li>새 파일 안의 기본 글을 지우고(몇 줄뿐이에요) 길게 눌러 <b>붙여넣기</b> → 저장합니다.</li>
<li>예전 파일 <b>Code.gs</b> 옆 점 세 개(⋮) → <b>삭제</b>합니다.</li>
<li><b>배포 → 배포 관리</b> → 연필 → 버전 <b>새 버전</b> → <b>배포</b>.</li>
</ol>
<small>통째로 지우기 어려운 예전 코드를 고치는 대신, 새 파일에 붙여 넣고 예전 파일을 지우는 방법입니다.</small>
</main>
<script>
const b = document.getElementById("b"), msg = document.getElementById("msg"), t = document.getElementById("t");
let code = "";
fetch("Code.gs?t=" + Date.now()).then(r => r.text()).then(x => {
  code = x; t.value = x; b.disabled = false; b.textContent = "서버 코드 전체 복사";
}).catch(() => { b.textContent = "불러오지 못했어요"; });
b.onclick = async () => {
  try { await navigator.clipboard.writeText(code); msg.textContent = "복사했어요 (" + code.split("\n").length + "줄). 이제 Apps Script에 붙여 넣으세요."; }
  catch (e) { t.style.display = "block"; t.focus(); t.select(); msg.textContent = "자동 복사가 막혀 있어요. 아래 칸을 길게 눌러 '전체 선택 → 복사' 해 주세요."; }
};
</script>
</body>
</html>
